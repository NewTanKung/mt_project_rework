<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}User{% endblock %} - บันทึกการประชุม</title>
    <!-- Bootstrap CSS (Offline) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/user/register">
                🎙️ บันทึกการประชุม
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/user/register' %}active{% endif %}"
                            href="/user/register">
                            ลงทะเบียนการประชุม
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/user/recording' %}active{% endif %}"
                            href="/user/recording">
                            การประชุม
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/user/manage' %}active{% endif %}"
                            href="/user/manage">
                            จัดการประชุม
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout(); return false;">
                            ออกจากระบบ
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="page-container">
        <main class="flex-grow-1">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index: 9999;"></div>

    <!-- Bootstrap JS (Offline) -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

    <!-- Common Scripts -->
    <script>
        // Logout function
        async function logout() {
            try {
                const response = await fetch('/api/auth/logout', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = data.redirect;
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // Show alert helper
        function showAlert(message, type = 'info', containerId = 'alertContainer') {
            const container = document.getElementById(containerId);
            if (!container) return;

            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-custom alert-dismissible fade show`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            container.innerHTML = '';
            container.appendChild(alert);

            // Auto dismiss after 5 seconds
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Format time helper (seconds to HH:MM:SS)
        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
    </script>

    {% block extra_js %}{% endblock %}

    <!-- Bootstrap Toast Notification System -->
    <script>
        // Global Toast Notification Function
        function showToast(message, type = 'info', duration = 5000) {
            const iconMap = {
                'success': '✅',
                'danger': '❌',
                'warning': '⚠️',
                'info': 'ℹ️',
                'primary': '📌'
            };

            const icon = iconMap[type] || 'ℹ️';

            const toastHTML = `
                <div class="toast align-items-center text-bg-${type} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">
                            <strong>${icon}</strong> ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `;

            const container = document.getElementById('toastContainer');
            if (!container) {
                console.error('Toast container not found');
                return;
            }

            container.insertAdjacentHTML('beforeend', toastHTML);

            const toastElement = container.lastElementChild;
            const toast = new bootstrap.Toast(toastElement, {
                autohide: true,
                delay: duration
            });

            toast.show();

            // Remove element after hidden
            toastElement.addEventListener('hidden.bs.toast', () => {
                toastElement.remove();
            });
        }

        // Backward compatibility: showAlert alias
        function showAlert(message, type = 'info') {
            showToast(message, type);
        }
    </script>
</body>

</html>
